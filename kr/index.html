<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow"><!-- preview: keep out of search results -->
  <meta property="og:title" content="Soyeon &amp; Doyoon — 2026년 10월 30일">
  <meta property="og:description" content="2026년 10월 30일 금요일 오후 6시 30분 · 신라호텔 영빈관">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://soyeondoyoon.fun">
  <meta property="og:image" content="https://soyeondoyoon.fun/shared/photos/og.jpg">

  <!-- 탭 아이콘은 래미 담당 -->
  <link rel="icon" type="image/png" sizes="32x32" href="../shared/doremy-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../shared/doremy-192.png">
  <link rel="apple-touch-icon" href="../shared/doremy-180.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- All KR type is SD정체 (the Sandoll webfont below): Korean at weight 400, and
       the Latin accents (monogram, INVITATION, ampersands, menu) at SD정체 630i.
       So NO Google font loads on first paint — the big curated Korean set (~500KB,
       render-blocking) AND the Latin serif are both gone. #gfonts stays empty and
       app.js's loadGoogleFonts fills it on demand ONLY if a visitor picks a Google
       font in the design panel. The preconnects above just warm that lazy path. -->
  <link id="gfonts" rel="stylesheet">

  <!-- ▼▼ Sandoll 웹폰트 (SD 정체 / font-family: "SD Jeongche") ▼▼
       산돌구름 프로젝트(소연도윤) → "HTML 복사" 스니펫(preconnect + stylesheet 두 줄)을
       아래 이 줄과 끝 표시 사이에 붙여넣으세요. 이 도메인(soyeondoyoon.fun)이 프로젝트에
       등록되어 있어야 폰트가 로드됩니다. -->
<link rel="preconnect" href="https://o6cdhdutve.execute-api.ap-northeast-2.amazonaws.com">
<link rel="stylesheet" href="https://o6cdhdutve.execute-api.ap-northeast-2.amazonaws.com/v1/api/css/drop_fontstream_css/?sid=gAAAAABqcVxZgeBrrsNfyPZQxhfQA4natdyUrD-2Kjxrww4-RDt_BETXqu48MXzRBePhnIvRiIgI0wOZMXL2_Tjo0HF6Jq1ZMXt3gokH5uL08hyi5w_Jx5_N9NW_5Pco6miQuwHJy4CITZaFag6gl5rMk6yMciZbW1qxzUeHWGqKCj0AhmMeNpeQ7JDqyqNAZ1ApgRNl5RvhIRMvmuBLQtgFYBEIGVu8Pnlub5prhvZ1yVl1U3x4lcnjUfLzQ4vAq5CYqLdbzpTy" charset="utf-8" referrerpolicy="origin"></link>
  <!-- ▲▲ Sandoll 스니펫 끝 ▲▲ -->

  <link rel="stylesheet" href="../shared/css/joy.css">

  <!-- Apply saved design settings before first paint to avoid flashing -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem("sd-design") || "{}");
        var l = s.layout || {};
        var d = document.documentElement;
        d.dataset.hero = l.hero || "banner";
        d.dataset.header = l.header || "stacked";
        d.dataset.mode = l.mode || "multi";
        d.dataset.width = l.width || "cozy";
        var c = s.colors || {};
        if (c.bg) d.style.setProperty("--c-bg", c.bg);
        if (c.accent) d.style.setProperty("--c-accent", c.accent);
        if (c.alt) d.style.setProperty("--c-alt", c.alt);
        if (c.text) d.style.setProperty("--c-text", c.text);
      } catch (e) { /* first visit */ }
    })();
  </script>
</head>
<body>

  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/welcome">
        <span class="brand-monogram" id="brandMonogram"></span>
        <span class="brand-names" id="brandNames"></span>
      </a>
      <nav class="site-nav" id="siteNav" aria-label="Site"></nav>
    </div>
  </header>

  <main id="main"><!-- pages are rendered here by shared/app.js --></main>

  <footer class="site-footer">
    <div class="footer-monogram" id="footerMonogram"></div>
    <div class="footer-line" id="footerLine"></div>
    <div class="footer-note">Made with love</div>
  </footer>

  <!-- ===================== Design customizer (hidden unless enabled) ===================== -->
  <button class="design-toggle" id="designToggle" aria-label="Open design settings" hidden>
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </svg>
    <span>Design</span>
  </button>

  <aside class="design-panel" id="designPanel" aria-label="Design settings">
    <div class="dp-head">
      <h3>Design</h3>
      <button class="dp-close" id="designClose" aria-label="Close">&times;</button>
    </div>
    <p class="dp-hint">Settings are saved in your browser.</p>

    <section class="dp-section">
      <h4>Fonts</h4>
      <label class="dp-field"><span>Headings</span><select id="fontHeading" data-role="heading"></select></label>
      <input class="dp-custom" id="fontHeadingCustom" type="text" placeholder="Any Google Font name…" hidden>
      <label class="dp-field"><span>Site title</span><select id="fontBrand" data-role="brand"></select></label>
      <input class="dp-custom" id="fontBrandCustom" type="text" placeholder="Any Google Font name…" hidden>
      <label class="dp-field"><span>Body text</span><select id="fontBody" data-role="body"></select></label>
      <input class="dp-custom" id="fontBodyCustom" type="text" placeholder="Any Google Font name…" hidden>
    </section>

    <section class="dp-section">
      <h4>Colors</h4>
      <div class="dp-swatches" id="paletteSwatches"></div>
      <div class="dp-colors">
        <label><span>Background</span><input type="color" id="colBg"></label>
        <label><span>Accent</span><input type="color" id="colAccent"></label>
        <label><span>Secondary</span><input type="color" id="colAlt"></label>
        <label><span>Text</span><input type="color" id="colText"></label>
      </div>
    </section>

    <section class="dp-section">
      <h4>Layout</h4>
      <div class="dp-field-row"><span>Hero</span>
        <div class="dp-radios" data-setting="hero">
          <button data-value="banner">Banner</button>
          <button data-value="classic">Classic</button>
          <button data-value="minimal">Minimal</button>
        </div>
      </div>
      <div class="dp-field-row"><span>Header</span>
        <div class="dp-radios" data-setting="header">
          <button data-value="stacked">Stacked</button>
          <button data-value="inline">Inline</button>
        </div>
      </div>
      <div class="dp-field-row"><span>Pages</span>
        <div class="dp-radios" data-setting="mode">
          <button data-value="multi">Separate</button>
          <button data-value="single">One page</button>
        </div>
      </div>
      <div class="dp-field-row"><span>Width</span>
        <div class="dp-radios" data-setting="width">
          <button data-value="cozy">Cozy</button>
          <button data-value="wide">Wide</button>
        </div>
      </div>
    </section>

    <button class="dp-reset" id="designReset">Reset to defaults</button>
  </aside>

  <!-- Lightbox for gallery photos -->
  <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="Photo"></div>

  <!-- Shared data backend (load order matters) -->
  <script src="../shared/site-config.js"></script>
  <script src="../shared/supabase-config.js"></script>
  <script>
    if (window.SUPABASE_CONFIG && window.SUPABASE_CONFIG.url && window.SUPABASE_CONFIG.anonKey) {
      document.write('<scr' + 'ipt src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/scr' + 'ipt>');
    }
  </script>
  <script src="../shared/store.localStorage.js"></script>
  <script src="../shared/store.supabase.js"></script>
  <script src="../shared/store.js"></script>

  <!-- Joy engine -->
  <script src="../shared/i18n.js"></script>
  <script src="../shared/rsvp-widget.js"></script>
  <script src="content.ko.js"></script>
  <script src="../shared/app.js"></script>
</body>
</html>
