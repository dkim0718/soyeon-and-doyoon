<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#fbf9f7">
<meta name="robots" content="noindex, nofollow"><!-- 초대받은 분만 보는 페이지 -->

<!-- 카카오톡/링크 미리보기용 절대주소 (배포 도메인) -->
<meta property="og:title" content="소연 ♥ 도윤 청모파티에 초대합니다">
<meta property="og:description" content="2026년 9월 18일 금요일 5:30 PM · 네이버즈 (서울 용산구 신흥로 99)">
<meta property="og:type" content="website">
<meta property="og:url" content="https://soyeondoyoon.com">
<meta property="og:image" content="https://soyeondoyoon.com/shared/photos/posters/portrait-final.jpg">

<!-- 탭 아이콘은 래미 담당 -->
<link rel="icon" type="image/png" sizes="32x32" href="../shared/doremy-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../shared/doremy-192.png">
<link rel="apple-touch-icon" href="../shared/doremy-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Noto Sans KR: 고딕(맑은 고딕) 테마용 — 세리프 테마에서는 내려받지 않습니다 -->
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/party/style.css">
</head>
<body>

<!-- 내용은 모두 invite/config.js + 관리자 수정본을 합쳐
     shared/party/main.js 가 그려 넣습니다. -->
<div class="app" id="app">

  <!-- 포스터 (문구는 이미지 안에 포함) -->
  <div id="posters"></div>

  <!-- 사진 아래: 타이틀 · 장소 · 일시 -->
  <section class="intro" id="intro"></section>

  <!-- 떠 있는 섹션 바 — 첫 포스터를 지나면 나타납니다 -->
  <nav class="nav" id="nav" aria-label="섹션 이동"><div class="nav-inner"></div></nav>

  <main>
    <section class="sec reveal" id="must"></section>
    <section class="sec reveal" id="story"></section>
    <section class="sec reveal" id="schedule"></section>
    <section class="sec reveal" id="location"></section>
    <section class="sec reveal" id="qa"></section>
    <section class="sec reveal" id="rsvp"></section>
  </main>

  <footer class="foot" id="foot"></footer>
</div>

<!-- 청모파티 참석 · 메뉴 접수 시트 -->
<div class="overlay" id="rsvpOverlay">
  <div class="sheet" id="rsvpSheet" role="dialog" aria-modal="true" aria-label="청모파티 참석 여부 전달"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- 내용 설정 -->
<script src="config.js"></script>
<!-- 공유 데이터 백엔드 (로드 순서 중요) -->
<script src="../shared/site-config.js"></script>
<script src="../shared/supabase-config.js"></script>
<!-- supabase-js v2, self-hosted: 하객 접수 경로가 외부 CDN 에 의존하지 않도록 -->
<script src="../shared/vendor/supabase-js-v2.js"></script>
<script src="../shared/store.localStorage.js"></script>
<script src="../shared/store.supabase.js"></script>
<script src="../shared/store.js"></script>
<!-- 청모파티 엔진 -->
<script src="../shared/party/main.js"></script>
</body>
</html>
